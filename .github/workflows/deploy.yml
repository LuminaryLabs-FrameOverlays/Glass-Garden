name: Glass Garden — sandbox inputs and deployment

# Dependency transport only. Public deployment remains gated by local validation.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: glass-garden-preparation
  cancel-in-progress: false
jobs:
  nexus-build-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Resolve the source-declared compiler dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir nexus-build-dependencies
          cd nexus-build-dependencies
          printf '%s\n' '{"private":true,"dependencies":{"@typescript/typescript6":"6.0.2"}}' > package.json
          npm install --ignore-scripts --no-audit --no-fund
          npm ls --depth=0 --json > versions.json
          cd ..
          tar -czf nexus-build-dependencies.tar.gz nexus-build-dependencies
          sha256sum nexus-build-dependencies.tar.gz > nexus-build-dependencies.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-build-dependencies
          path: |
            nexus-build-dependencies.tar.gz
            nexus-build-dependencies.sha256
          retention-days: 7
          compression-level: 0
